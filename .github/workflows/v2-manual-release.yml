name: v2 Manual Release (No Notes)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            args: ''
          - os: macos-latest
            label: macOS (universal)
            args: '--target universal-apple-darwin'
          - os: windows-latest
            label: Windows
            args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Read release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./v2/src-tauri/tauri.conf.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid v2 version in v2/src-tauri/tauri.conf.json: $version" >&2
            exit 1
          fi

          tag="v2-$version"
          if [[ "$version" =~ -(alpha|beta|rc|preview|pre)([.-]?[0-9]+)?$ ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/src-tauri/target
          key: ${{ runner.os }}-cargo-v2-release-${{ hashFiles('v2/src-tauri/Cargo.lock') }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: v2
        run: npm ci

      - name: Build + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: v2
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: 'Shield Optimizer ${{ steps.release.outputs.tag }}'
          releaseDraft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Same as merge-updater in v2-release.yml: commit the merged latest.json that
  # tauri-action uploaded to the release, so the raw.githubusercontent endpoint
  # in tauri.conf.json resolves to this release.
  merge-updater:
    needs: build
    name: Publish updater manifest
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest.json from release
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p v2/updater

          # tauri-action may take a moment to finalize the asset; retry a few times.
          for attempt in 1 2 3 4 5; do
            if gh release download "$TAG" --pattern 'latest.json' --dir /tmp --clobber; then
              break
            fi
            echo "  attempt $attempt: latest.json not ready, retrying in 15s…"
            sleep 15
          done
          [[ -f /tmp/latest.json ]] || { echo "latest.json not found on release $TAG"; exit 1; }

          cp /tmp/latest.json v2/updater/latest.json
          echo "Updater manifest for $TAG:"
          cat v2/updater/latest.json

      - name: Commit updater manifest
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/updater/latest.json
          if git diff --cached --quiet; then
            echo "Updater manifest unchanged; nothing to commit."
          else
            git commit -m "Update updater manifest for ${TAG}"
            git push origin HEAD:main
            echo "Updater manifest published for ${TAG}."
          fi
